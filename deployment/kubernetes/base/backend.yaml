apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: employeesphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: database-migrations
          image: ghcr.io/REPLACE_OWNER/employeesphere-backend:latest
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: employeesphere-config
            - secretRef:
                name: employeesphere-secret
      containers:
        - name: backend
          image: ghcr.io/REPLACE_OWNER/employeesphere-backend:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: employeesphere-config
            - secretRef:
                name: employeesphere-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: employeesphere
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
