apiVersion: v1
kind: ConfigMap
metadata:
  name: employeesphere-config
data:
  PROJECT_NAME: EmployeeSphere
  VERSION: "1.0.0"
  API_V1_STR: /api
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "480"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  BACKEND_CORS_ORIGINS: "[]"
---
apiVersion: v1
kind: Secret
metadata:
  name: employeesphere-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
  SECRET_KEY: {{ required "database.secretKey is required" .Values.database.secretKey | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@postgres:5432/%s" .Values.database.user .Values.database.password .Values.database.name | quote }}
